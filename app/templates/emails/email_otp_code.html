<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code de vérification — Myeline</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="width:100%;background:#f4f4f7;padding:32px 16px;box-sizing:border-box;">
    <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.07);">

      <div style="background:#ffffff;text-align:center;padding:24px 40px 20px;border-bottom:1px solid #f0f0f0;">
        <a href="{{ external_url }}" style="text-decoration:none;display:inline-block;line-height:1;">
          <img src="{{ external_url }}/static/logo.png" alt="Myeline" style="width:36px;height:36px;border-radius:50%;vertical-align:middle;margin-right:8px;">
          <span style="font-size:20px;font-weight:600;color:#1d1d1f;vertical-align:middle;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">myeline<span style="color:#3ab4cc;">.io</span></span>
        </a>
      </div>

      <div style="padding:36px 40px;color:#1d1d1f;text-align:center;">
        <p style="font-size:15px;color:#444;margin:0 0 24px;">Votre code de vérification à usage unique :</p>

        <div style="display:inline-block;background:#f0f6ff;border:2px solid #007AFF;border-radius:12px;padding:16px 32px;margin:0 0 24px;">
          <span style="font-size:36px;font-weight:700;letter-spacing:8px;color:#007AFF;font-family:'Courier New',Courier,monospace;">{{ code }}</span>
        </div>

        <p style="font-size:13px;color:#888;margin:0;">Valable 10 minutes. Ne le partagez jamais.</p>
      </div>

      <div style="background:#f8f8f8;border-top:1px solid #ebebeb;text-align:center;padding:16px 40px;">
        <p style="font-size:12px;color:#aaa;margin:0;">
          <a href="{{ external_url }}" style="color:#007AFF;text-decoration:none;">myeline.io</a>
        </p>
      </div>

    </div>
  </div>
</body>
</html>
