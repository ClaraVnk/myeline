<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau message de contact — Myeline</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="width:100%;background:#f4f4f7;padding:32px 16px;box-sizing:border-box;">
    <div style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.07);">

      <div style="background:#007AFF;padding:20px 36px;">
        <h2 style="color:#ffffff;margin:0;font-size:18px;font-weight:600;">Nouveau message de contact</h2>
      </div>

      <div style="padding:32px 36px;color:#1d1d1f;">
        <div style="margin-bottom:20px;">
          <div style="font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">Nom</div>
          <div style="font-size:15px;color:#1d1d1f;line-height:1.6;">{{ name }}</div>
        </div>
        <div style="margin-bottom:20px;">
          <div style="font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">Email</div>
          <div style="font-size:15px;color:#1d1d1f;line-height:1.6;"><a href="mailto:{{ email }}" style="color:#007AFF;text-decoration:none;">{{ email }}</a></div>
        </div>
        <div style="margin-bottom:20px;">
          <div style="font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">Message</div>
          <div style="background:#f8f8f8;border-radius:8px;padding:16px 20px;font-size:15px;color:#444;line-height:1.7;white-space:pre-wrap;">{{ message }}</div>
        </div>
      </div>

      <div style="background:#f8f8f8;border-top:1px solid #ebebeb;text-align:center;padding:16px 36px;">
        <p style="font-size:12px;color:#aaa;margin:0;">Message reçu via le formulaire de contact Myeline</p>
      </div>

    </div>
  </div>
</body>
</html>
