[pytest]
# Parallel test execution by default — 1129 tests drop from ~145s to ~50s on
# a 4-core dev machine. xdist is also what CI uses.
# Override with `pytest -n0` if you need a single-process run for debugging
# (e.g. pdb, coverage with --cov).
addopts = -n auto

# Tests live under tests/, no need to scan the whole repo.
testpaths = tests

# Don't collect anything that's not a test module.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Treat unraisable / pending-deprecation warnings as default — most are
# inside third-party libs (google-auth, authlib, sqlalchemy) and we can't
# fix them upstream from a test config.
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning

# Custom markers — declared so the suite doesn't emit
# PytestUnknownMarkWarning when a test uses one.
markers =
    no_mock_email: opt out of the global Brevo mailer mock (mailer-internal tests only)
