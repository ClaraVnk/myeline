[flake8]
max-line-length = 120
exclude = 
    .git,
    __pycache__,
    .venv,
    venv,
    env,
    migrations,
    data,
    logs,
    build,
    dist,
    *.egg-info
ignore = E126,E127,E128,E131,E203,E221,E222,E226,E241,E303,E305,E306,E501,F401,F402,F811,F841,W293,W503
per-file-ignores =
    __init__.py:F401
    app/__init__.py:F401

[isort]
profile = black
multi_line_output = 3
line_length = 120
lines_after_imports = 2
# Force isort to always categorise `app.*` and `tests.*` as first-party,
# regardless of whether the package happens to be installed in the venv.
# Without this, an editable install on dev (where app/ is on sys.path)
# can disagree with a fresh CI checkout, producing spurious "imports
# incorrectly sorted" failures only on CI.
known_first_party = app,tests
skip_glob =
    migrations/*,
    data/*,
    logs/*,
    .git/*,
