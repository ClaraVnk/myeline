name: CI & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (flake8 + isort + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Bug C-M4 (audit round 3) — la CI tournait en 3.12 alors que
      # l'image runtime + la prod tournent en 3.13. Drift de version =
      # un import 3.13-only n'est jamais couvert par les tests CI.
      - name: Setup Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linters
        run: pip install -r requirements-dev.txt

      - name: flake8
        run: flake8 --config=./config/setup.cfg .

      - name: isort (check only)
        run: isort --settings-path config/setup.cfg --check-only .

      - name: bandit
        run: bandit -c bandit.yaml -r . -n 10 --severity-level medium

  tests:
    name: Functional tests (pytest)
    runs-on: ubuntu-latest

    # CI flakes pré-existantes — admin_ops_routes / clear_cache et autres
    # paths touchent Redis directement (pas via le MockLimiter). Sans
    # service Redis le test est flaky selon le scheduling xdist. Un
    # vrai Redis 7-alpine ici coûte ~3s de cold start et stabilise
    # définitivement la suite (cf. troubleshooting 2026-05).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Bug C-M4 (audit round 3) — la CI tournait en 3.12 alors que
      # l'image runtime + la prod tournent en 3.13. Drift de version =
      # un import 3.13-only n'est jamais couvert par les tests CI.
      - name: Setup Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          TESTING: "true"
          DISABLE_RECAPTCHA: "true"
          SECRET_KEY: "ci-secret-key"
          MISTRAL_API_KEY: "test"
          BREVO_API_KEY: "test"
          REDIS_URL: "redis://localhost:6379/0"
          DATABASE_URL: "sqlite:///:memory:"
        run: pytest tests/ -n auto -q

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        id: repo
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ghcr.io/${{ steps.repo.outputs.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo.outputs.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo.outputs.repository }}:buildcache,mode=max
